name: Rilis Tema

# Memicu build-release.sh saat tag `v*` di-push, lalu publish hasilnya sebagai
# GitHub Release -- padanan release.yml modul (mis. modul-anjungan), dibaca
# App\Services\Theme\ThemeCatalogSyncService (Layanan#1341).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bangun artefak
        run: bash build-release.sh dist

      - name: Publikasikan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
